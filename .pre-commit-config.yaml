# Vendored verbatim from github.com/IsaiahPressman/Kaggle_Lux_AI_2021. Reformatting
# it would make our copy diverge from the artifact we are reproducing, and we would
# no longer be able to tell a bad result in their recipe from a bad transcription.
exclude: ^src/kaggriculture/learn/toad/(conf/|core/|nns/|monobeast\.py$|reward_spaces_lux\.py$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: requirements-txt-fixer
  - repo: https://github.com/will-rice/prettier-pre-commit
    rev: v1.0.7
    hooks:
      - id: prettier-format
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        language: system
        entry: uv run ruff format
        files: ^(src|tests|baselines)/.*\.py$|^[^/]*\.py$
        # The served agent is a public kernel vendored byte for byte, and its
        # header asserts the SHA-256 the notebook itself publishes over exactly
        # the bytes in this file. Formatting it would not change how it plays,
        # and would leave that claim with nothing to be checked against -- the
        # same reason the Toad tree above is excluded. `ruff check` and `ty`
        # still run on it; only the formatter is held off.
        exclude: ^src/kaggriculture/kaito_v54_policy\.py$
        pass_filenames: true
      - id: ruff
        name: ruff
        language: system
        entry: uv run ruff check --fix
        files: ^(src|tests|baselines)/.*\.py$|^[^/]*\.py$
        pass_filenames: true
      - id: ty
        name: ty
        language: system
        entry: uv run ty check
        files: ^(src|tests|baselines)/.*\.py$|^[^/]*\.py$
        pass_filenames: false
      - id: pytest
        name: pytest
        language: system
        entry: uv run python -m pytest
        pass_filenames: false
        always_run: true
