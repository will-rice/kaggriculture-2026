[project]
name = "kaggriculture"
version = "0.1.0"
description = "Agent for the Kaggriculture simulation competition on Kaggle."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
# Kaggle runs agents on gcr.io/kaggle-images/python, whose interpreter is
# 3.12.13. Develop on the runner's own version: pinning below it leaves a gap
# where a program could use something the local interpreter accepts and the
# runner removed, and validation would pass it.
requires-python = ">=3.12"
dependencies = [
  "gitpython>=3.1.61",
  "kaggle-environments>=1.32.7",
  "kaggle>=1.7.4",
  "pre-commit>=4.1.0",
  "pydantic>=2.12.2",
  "pytest>=8.3.4",
  "python-dotenv>=1.1.1",
  "ruff>=0.9.7",
  "tqdm>=4.70.0",
  "ty>=0.0.18",
  "wandb>=0.29.0",
]

[build-system]
requires = ["uv_build>=0.9.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["kaggriculture"]

[tool.ruff.lint.isort]
known-first-party = ["kaggriculture"]
# The local `wandb/` run directory would otherwise make ruff read wandb as ours.
known-third-party = ["wandb"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
# The seed is the campaign's own output and it arrives complex: `agent` is 111
# where the limit is 10, and three helpers are 13 to 22. Everything else ruff
# asked for has been fixed and the program was checked to play identically
# afterwards, turn for turn over six episodes.
#
# The complexity is real and it is debt, not an exemption on principle -- a
# 111-branch function is exactly what makes a round spend its call reading
# rather than improving. It is left for the search to pay down, because
# splitting it by hand is a change to how it plays and that is what the search
# is for. The round asks for it; this line is what stops it blocking the
# commit in the meantime.
"src/kaggriculture/seed/main.py" = ["C901"]
# The experiments are variants of that same seed, each differing from it in one
# place, so they inherit its four complex functions unchanged. Fixing the
# complexity here would mean they no longer differ in one place, and the
# head-to-head against the seed would stop meaning anything.
"experiments/*/main.py" = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
# The repository root as well as src/, so tests can import their own package
# (tests/rust shares its policies between modules) and the research scripts
# under docs/ can import their sibling `_common`.
root = ["./src", "."]
# The Rust bindings' stub file is their type surface, so ty can check code
# that imports `kaggriculture_engine` without the extension being built.
extra-paths = ["./rust/python"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: hundreds of tapes and every local_data test; run with -m slow before pushing",
  "local_data: needs /data/kaggriculture or the local Kaggle image; implies slow, and is skipped where absent",
]
addopts = "-m 'not slow'"
# The suite is what lives under tests/, never what a campaign leaves lying
# about under run/.
testpaths = ["tests"]

[dependency-groups]
rust = ["maturin>=1.8,<2"]

[project.scripts]
package = "kaggriculture.scripts.package:main"
submit = "kaggriculture.scripts.submit:main"
campaign = "kaggriculture.campaign.harness:main"
replay-corpus = "kaggriculture.scripts.replay_corpus:main"
build-order = "kaggriculture.scripts.build_order:main"
report = "kaggriculture.scripts.report:main"
strategies = "kaggriculture.scripts.strategies:main"
extract-corpus = "kaggriculture.scripts.extract_corpus:main"
