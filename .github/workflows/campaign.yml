# Everything the campaign loop depends on that can be proved without the
# local data box: the engine port builds and loads, the archive, pool, gate
# and loop logic, validation, packaging. Tests that need the vendored
# opponent corpus, the episode archive or the Kaggle image are marked
# `local_data` and skip here (tests/conftest.py); pre-commit runs them on
# the box that has the data.
#
# The games database is *not* one of those. It holds no vendored anything --
# the live tests each build a database of their own and drop it -- and it is
# where this week's two silent failures both lived: two tables whose partition
# keys had drifted froze the corpus for four days, and a reader left on SQLite
# after the migration took the nightly job down. Neither was visible here,
# because without a server those tests raise `Connection refused` rather than
# skip, and the whole check has been red on main since that migration landed.
name: campaign

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The version the compose file pins, on the port `config.GAMES_URL`
      # defaults to. Never seeded with rows: what the live tests check is the
      # storage's own behaviour, and each builds the database it needs.
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          # `games.query` sends no credentials at all -- the server it was
          # written for is bound to localhost on one box -- so it arrives as
          # `default`, and a fresh image gives that user a password. This is the
          # image's own switch for leaving the user setup alone.
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run ty check src tests
      # The empty tables, because not every reader builds its own. A test that
      # asks the record about an episode -- `measure.against` refusing a key it
      # cannot find, before spending ten minutes of games on it -- gets
      # "Database games does not exist" from a bare server, which is a failure
      # about the runner rather than about the code. `create` is additive and
      # idempotent, and it also checks the declared partition keys against the
      # live ones, which is the drift that froze the corpus for four days.
      - run: uv run python -c "from kaggriculture.campaign import games; games.create()"
      - run: uv run pytest -q
