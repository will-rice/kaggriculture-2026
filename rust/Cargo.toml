[workspace]
members = ["python"]

[package]
name = "kaggriculture-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Kaggriculture reference interpreter from kaggle-environments"
license = "Apache-2.0"
publish = false

[lib]
name = "kaggriculture_engine"
path = "src/lib.rs"

[[bin]]
name = "kaggriculture-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps object keys in insertion order, so emitted
# observations match the reference's dict ordering (which matters for
# per-unit inventories). float_roundtrip parses floats exactly, as CPython
# does; without it a configured weedSpawnChance can land one ulp off and
# flip a weed roll.
serde_json = { version = "1.0", features = [
  "preserve_order",
  "float_roundtrip",
] }

[profile.release]
lto = true
codegen-units = 1
