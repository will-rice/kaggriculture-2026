[workspace]
members = ["python"]

[package]
name = "kaggriculture-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Kaggriculture reference interpreter from kaggle-environments"
license = "Apache-2.0"
publish = false

[lib]
name = "kaggriculture_engine"
path = "src/lib.rs"

[[bin]]
name = "kaggriculture-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps object keys in insertion order, so emitted
# observations match the reference's dict ordering (which matters for
# per-unit inventories). float_roundtrip parses floats exactly, as CPython
# does; without it a configured weedSpawnChance can land one ulp off and
# flip a weed roll.
serde_json = { version = "1.0", features = [
  "preserve_order",
  "float_roundtrip",
] }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# The engine mirrors Python arithmetic: money is a float that integer prices
# are added to, day and step counters are i64, and board coordinates index
# Vecs. Every such cast is deliberate and bounded by the rules tables, so
# the precision and truncation lints only add noise here.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Money is compared exactly on purpose: the reference compares floats with
# `<`, and a tolerance would change which orders fill.
float_cmp = "allow"
# Getters on state types are used for their values; a must_use on each adds
# nothing a caller could act on.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true
